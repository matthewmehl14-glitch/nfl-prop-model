<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Simulation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">NFL 10K Simulation Engine</h1>
        
        <div class="flex space-x-4 mb-8">
            <button onclick="showTab('dashboard')" class="bg-blue-600 text-white px-5 py-2 rounded shadow hover:bg-blue-700">Live Player Cards</button>
            <button onclick="showTab('backtest')" class="bg-gray-800 text-white px-5 py-2 rounded shadow hover:bg-gray-900">Backtest & Edge Buckets</button>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard">
            <select id="gameSelect" class="p-3 mb-6 rounded shadow border-gray-300 w-full md:w-1/3">
                <option value="all">All Games</option>
            </select>
            
            <div id="playerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- BACKTEST VIEW -->
        <div id="backtest" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Edge Bucket Performance ($25 Flat)</h2>
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full text-left">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-4 font-bold">Edge Bucket</th>
                            <th class="p-4 font-bold">Total Bets</th>
                            <th class="p-4 font-bold">Win Rate</th>
                            <th class="p-4 font-bold">Total P&L</th>
                        </tr>
                    </thead>
                    <tbody id="bucketTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('backtest').classList.add('hidden');
            document.getElementById(tab).classList.remove('hidden');
        }

        // Initialize Data
        Promise.all([
            fetch('data.json').then(r => r.json()),
            fetch('backtest_log.json').then(r => r.json())
        ]).then(([liveData, logData]) => {
            
            // Build Dashboard
            const games = [...new Set(liveData.map(item => item.game))];
            const select = document.getElementById('gameSelect');
            games.forEach(game => select.innerHTML += `<option value="${game}">${game}</option>`);

            function renderCards(filterGame) {
                const grid = document.getElementById('playerGrid');
                grid.innerHTML = ''; 
                const filtered = filterGame === 'all' ? liveData : liveData.filter(d => d.game === filterGame);

                filtered.forEach(player => {
                    const evClass = player.ev > 0.03 ? 'text-green-600 font-bold' : 'text-gray-600';
                    grid.innerHTML += `
                        <div class="bg-white rounded-lg shadow-md p-5 border-t-4 border-blue-600">
                            <h2 class="text-xl font-bold">${player.name}</h2>
                            <p class="text-sm text-gray-500 border-b pb-2 mb-3">${player.game}</p>
                            <div class="flex justify-between items-center text-sm">
                                <span class="font-semibold uppercase text-xs text-gray-500">${player.prop.replace('player_', '').replace(/_/g, ' ')}</span>
                                <span>Line: ${player.line}</span>
                                <span>Proj: ${player.proj}</span>
                                <span class="${evClass}">EV: ${(player.ev * 100).toFixed(2)}%</span>
                            </div>
                        </div>
                    `;
                });
            }
            renderCards('all');
            select.addEventListener('change', (e) => renderCards(e.target.value));

            // Build Backtest Buckets
            const graded = logData.filter(d => d.status === 'graded');
            const buckets = {"3-5%": {bets: 0, wins: 0, pnl: 0}, "5-8%": {bets: 0, wins: 0, pnl: 0}, "8%+": {bets: 0, wins: 0, pnl: 0}};
            
            graded.forEach(bet => {
                if (buckets[bet.bucket]) {
                    buckets[bet.bucket].bets += 1;
                    if (bet.pnl > 0) buckets[bet.bucket].wins += 1;
                    buckets[bet.bucket].pnl += bet.pnl;
                }
            });

            let tableHTML = '';
            for (const [key, stats] of Object.entries(buckets)) {
                let winRate = stats.bets > 0 ? ((stats.wins / stats.bets) * 100).toFixed(1) : '0.0';
                let pnlColor = stats.pnl > 0 ? 'text-green-600' : (stats.pnl < 0 ? 'text-red-600' : 'text-gray-900');
                tableHTML += `
                    <tr class="border-t">
                        <td class="p-4 font-bold text-gray-800">${key}</td>
                        <td class="p-4">${stats.bets}</td>
                        <td class="p-4">${winRate}%</td>
                        <td class="p-4 font-bold ${pnlColor}">$${stats.pnl.toFixed(2)}</td>
                    </tr>
                `;
            }
            document.getElementById('bucketTable').innerHTML = tableHTML;
        });
    </script>
</body>
</html>
